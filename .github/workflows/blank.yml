name: BuiKern S9Ta9

on:
  workflow_dispatch:

jobs:
  build:
    name: BuiKern S9Ta9 by ${{ github.actor }}
    runs-on: ubuntu-22.04

    env:
      ARCH: arm64
      SUBARCH: arm64

      WORKSPACE: ${{ github.workspace }}/kernel_workspace
      KERNEL_DIR: ${{ github.workspace }}/kernel_workspace/gta9
      OUT_DIR: ${{ github.workspace }}/kernel_workspace/gta9/out

      KERNEL_REPO: https://github.com/prabhatkrmishra/kernel_samsung_gta9.git
      KERNEL_BRANCH: "15.0"
      DEFCONFIG: "gta9_defconfig"

      CLANG_VERSION: "r416183b"

      SUSFS_BRANCH: "gki-android13-5.10"

      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

      # ==========================================================
      # FIX UNTUK HOST TOOLS KERNEL 5.10 + GCC MODERN
      # Khususnya scripts/dtc/dtc
      # ==========================================================
      HOSTCFLAGS: "-fcommon"
      HOSTCXXFLAGS: "-fcommon"

    steps:

      # ==========================================================
      # 01. CHECKOUT
      # ==========================================================
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          clean: false
          fetch-depth: 1

      # ==========================================================
      # 02. SWAP
      # ==========================================================
      - name: Set swap space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      # ==========================================================
      # 03. HOST DEPENDENCIES
      # ==========================================================
      - name: Setup Build Environment
        shell: bash
        run: |
          set -euxo pipefail

          echo "BUILD_TIME=$(TZ=Asia/Jakarta date '+%Y%m%d%H%M')" >> "$GITHUB_ENV"

          sudo apt-get update

          sudo apt-get install -y \
            git \
            curl \
            wget \
            ca-certificates \
            ccache \
            bc \
            bison \
            flex \
            gawk \
            gcc \
            g++ \
            make \
            build-essential \
            libssl-dev \
            libelf-dev \
            libdw-dev \
            libncurses5-dev \
            libncurses-dev \
            libc6-dev-i386 \
            lib32z1-dev \
            lib32ncurses5-dev \
            libxml2-utils \
            xsltproc \
            unzip \
            zip \
            rsync \
            lz4 \
            lzop \
            zlib1g-dev \
            device-tree-compiler \
            python3 \
            perl \
            cpio \
            dwarves \
            pkg-config \
            libyaml-dev \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi

          mkdir -p "$WORKSPACE"
          mkdir -p "$WORKSPACE/downloads"
          mkdir -p "$GITHUB_WORKSPACE/output"

          echo
          echo "=================================================="
          echo "HOST"
          echo "=================================================="

          uname -a

          echo
          echo "GCC:"
          gcc --version | head -n 1

          echo
          echo "AARCH64 GCC:"
          aarch64-linux-gnu-gcc --version | head -n 1

          echo
          echo "HOSTCFLAGS=$HOSTCFLAGS"

      # ==========================================================
      # 04. CCACHE
      # ==========================================================
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: gta9-ccache-${{ runner.os }}-${{ env.KERNEL_BRANCH }}-${{ env.CLANG_VERSION }}-${{ github.sha }}
          restore-keys: |
            gta9-ccache-${{ runner.os }}-${{ env.KERNEL_BRANCH }}-${{ env.CLANG_VERSION }}-
            gta9-ccache-${{ runner.os }}-

      # ==========================================================
      # 05. CONFIGURE CCACHE
      # ==========================================================
      - name: Configure ccache
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p ~/.cache/ccache

          ccache --set-config=max_size=5G
          ccache --set-config=compression=true

          echo "CCACHE_DIR=$HOME/.cache/ccache" >> "$GITHUB_ENV"

          ccache --show-config
          ccache --show-stats || true

      # ==========================================================
      # 06. CLONE GTA9
      # ==========================================================
      - name: Clone GTA9 Kernel Source
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf "$KERNEL_DIR"

          echo
          echo "=================================================="
          echo "GTA9 KERNEL SOURCE"
          echo "=================================================="

          echo "Repository : $KERNEL_REPO"
          echo "Branch     : $KERNEL_BRANCH"
          echo "Defconfig  : $DEFCONFIG"

          git clone \
            --depth=1 \
            --branch "$KERNEL_BRANCH" \
            "$KERNEL_REPO" \
            "$KERNEL_DIR"

          cd "$KERNEL_DIR"

          echo
          echo "=================================================="
          echo "BRANCH"
          echo "=================================================="

          git branch --show-current

          echo
          echo "=================================================="
          echo "COMMIT"
          echo "=================================================="

          git rev-parse HEAD

          echo
          echo "=================================================="
          echo "KERNEL VERSION"
          echo "=================================================="

          make kernelversion

          echo
          echo "=================================================="
          echo "GTA9 DEFCONFIG"
          echo "=================================================="

          find arch/arm64/configs \
            -maxdepth 1 \
            -type f \
            \( \
              -name 'gta9*' \
              -o -name '*8781*' \
            \) \
            -printf '%f\n' \
            | sort

          test -f "arch/arm64/configs/$DEFCONFIG"

          ls -lh "arch/arm64/configs/$DEFCONFIG"

          echo
          echo "DEFCONFIG FOUND: $DEFCONFIG"

      # ==========================================================
      # 07. PREPARE KERNELSU
      # ==========================================================
      - name: Prepare KernelSU Workspace
        shell: bash
        run: |
          set -euxo pipefail

          cd "$KERNEL_DIR"

          echo
          echo "=================================================="
          echo "PREPARE KERNELSU"
          echo "=================================================="

          rm -rf KernelSU

          echo "KernelSU workspace cleared."

          echo
          echo "Existing .gitmodules:"
          cat .gitmodules 2>/dev/null || true

      # ==========================================================
      # 08. CACHE CLANG
      # ==========================================================
      - name: Cache Android Clang
        uses: actions/cache@v4
        with:
          path: ${{ env.WORKSPACE }}/prebuilts/clang/host/linux-x86/clang-${{ env.CLANG_VERSION }}
          key: gta9-clang-${{ env.CLANG_VERSION }}

      # ==========================================================
      # 09. SETUP CLANG
      # ==========================================================
      - name: Setup Android Clang
        shell: bash
        run: |
          set -euxo pipefail

          CLANG_ROOT="$WORKSPACE/prebuilts/clang/host/linux-x86/clang-$CLANG_VERSION"

          echo
          echo "=================================================="
          echo "CLANG SETUP"
          echo "=================================================="

          if [ ! -x "$CLANG_ROOT/bin/clang" ]; then

            echo "Clang cache miss."
            echo "Downloading Android Clang $CLANG_VERSION"

            mkdir -p "$WORKSPACE/prebuilts/clang/host/linux-x86"
            mkdir -p "$WORKSPACE/downloads"

            cd "$WORKSPACE/downloads"

            rm -f "clang-${CLANG_VERSION}.tar.gz"

            wget \
              --show-progress \
              "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12-release/clang-${CLANG_VERSION}.tar.gz" \
              -O "clang-${CLANG_VERSION}.tar.gz"

            mkdir -p "$CLANG_ROOT"

            tar \
              -xzf \
              "clang-${CLANG_VERSION}.tar.gz" \
              -C \
              "$CLANG_ROOT"

          else

            echo "Using cached Clang."

          fi

          test -x "$CLANG_ROOT/bin/clang"

          echo "CLANG_PREBUILT_BIN=$CLANG_ROOT/bin" >> "$GITHUB_ENV"
          echo "$CLANG_ROOT/bin" >> "$GITHUB_PATH"

          echo
          echo "=================================================="
          echo "CLANG VERSION"
          echo "=================================================="

          "$CLANG_ROOT/bin/clang" --version

          echo
          echo "LLVM:"
          "$CLANG_ROOT/bin/ld.lld" --version | head -n 3

      # ==========================================================
      # 10. RESUKISU
      # ==========================================================
      - name: Setup ReSukiSU
        shell: bash
        run: |
          set -euxo pipefail

          cd "$KERNEL_DIR"

          echo
          echo "=================================================="
          echo "RESUKISU SETUP"
          echo "=================================================="

          curl -LSs \
            "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" \
            -o /tmp/resukisu_setup.sh

          chmod +x /tmp/resukisu_setup.sh

          bash /tmp/resukisu_setup.sh main

          echo
          echo "=================================================="
          echo "VERIFY RESUKISU"
          echo "=================================================="

          test -d "$KERNEL_DIR/KernelSU"
          test -d "$KERNEL_DIR/KernelSU/kernel"
          test -L "$KERNEL_DIR/drivers/kernelsu"

          echo "ReSukiSU integration: OK"

          ls -la "$KERNEL_DIR/KernelSU" | head -n 40

      # ==========================================================
      # 11. SUSFS
      # ==========================================================
      - name: Setup SUSFS
        shell: bash
        run: |
          set -u

          cd "$KERNEL_DIR"

          SUSFS_DIR="$WORKSPACE/susfs_src"

          echo
          echo "=================================================="
          echo "SUSFS SETUP"
          echo "=================================================="

          rm -rf "$SUSFS_DIR"

          if ! git clone \
            --depth=1 \
            --branch "$SUSFS_BRANCH" \
            "https://gitlab.com/simonpunk/susfs4ksu.git" \
            "$SUSFS_DIR"
          then
            echo "WARNING: SUSFS clone gagal."
            echo "Melanjutkan tanpa SUSFS."
            echo "SUSFS_ENABLED=false" >> "$GITHUB_ENV"
            exit 0
          fi

          KSU_PATCH="$(find \
            "$SUSFS_DIR/kernel_patches" \
            -type f \
            -path '*/KernelSU/10_enable_susfs_for_ksu.patch' \
            -print \
            -quit)"

          KERNEL_PATCH="$(find \
            "$SUSFS_DIR/kernel_patches" \
            -type f \
            -name '50_add_susfs_in_kernel*.patch' \
            -print \
            | grep "$SUSFS_BRANCH" \
            | head -n 1 || true)"

          if [ -z "$KERNEL_PATCH" ]; then
            KERNEL_PATCH="$(find \
              "$SUSFS_DIR/kernel_patches" \
              -type f \
              -name '50_add_susfs_in_*.patch' \
              -print \
              | grep "$SUSFS_BRANCH" \
              | head -n 1 || true)"
          fi

          echo
          echo "KSU PATCH:"
          echo "${KSU_PATCH:-NOT FOUND}"

          echo
          echo "KERNEL PATCH:"
          echo "${KERNEL_PATCH:-NOT FOUND}"

          if [ -z "$KSU_PATCH" ] || [ -z "$KERNEL_PATCH" ]; then
            echo
            echo "WARNING: SUSFS patch tidak lengkap."
            echo "Melanjutkan tanpa SUSFS."
            echo "SUSFS_ENABLED=false" >> "$GITHUB_ENV"
            exit 0
          fi

          echo
          echo "=================================================="
          echo "TEST KSU SUSFS PATCH"
          echo "=================================================="

          cd "$KERNEL_DIR/KernelSU"

          if ! git apply --check "$KSU_PATCH"; then
            echo "KSU SUSFS patch tidak cocok."
            echo "SUSFS_ENABLED=false" >> "$GITHUB_ENV"
            exit 0
          fi

          git apply "$KSU_PATCH"

          echo "KSU SUSFS patch applied."

          echo
          echo "=================================================="
          echo "TEST KERNEL SUSFS PATCH"
          echo "=================================================="

          cd "$KERNEL_DIR"

          if ! git apply --check "$KERNEL_PATCH"; then
            echo "Kernel SUSFS patch tidak cocok."
            echo "SUSFS_ENABLED=false" >> "$GITHUB_ENV"
            exit 0
          fi

          git apply "$KERNEL_PATCH"

          echo "Kernel SUSFS patch applied."
          echo "SUSFS_ENABLED=true" >> "$GITHUB_ENV"

      # ==========================================================
      # 12. BASE DEFCONFIG
      # ==========================================================
      - name: Generate Base Config
        shell: bash
        run: |
          set -euxo pipefail

          cd "$KERNEL_DIR"

          rm -rf "$OUT_DIR"
          mkdir -p "$OUT_DIR"

          echo
          echo "=================================================="
          echo "GENERATE DEFCONFIG"
          echo "=================================================="

          make \
            O="$OUT_DIR" \
            ARCH="$ARCH" \
            "$DEFCONFIG"

          test -f "$OUT_DIR/.config"

      # ==========================================================
      # 13. MODIFY CONFIG
      # ==========================================================
      - name: Configure ReSukiSU Kernel
        shell: bash
        run: |
          set -euxo pipefail

          cd "$KERNEL_DIR"

          CONFIG="$OUT_DIR/.config"

          test -f "$CONFIG"

          echo
          echo "=================================================="
          echo "CONFIGURE KERNEL"
          echo "=================================================="

          cfg_enable() {
            "$KERNEL_DIR/scripts/config" \
              --file "$CONFIG" \
              --enable "$1"
          }

          cfg_disable() {
            "$KERNEL_DIR/scripts/config" \
              --file "$CONFIG" \
              --disable "$1"
          }

          # ------------------------------------------------------
          # ReSukiSU
          # ------------------------------------------------------

          cfg_enable CONFIG_KSU

          # ------------------------------------------------------
          # Samsung restrictions
          # ------------------------------------------------------

          cfg_disable CONFIG_SEC_RESTRICT_FORK
          cfg_disable CONFIG_SEC_RESTRICT_ROOTMOD
          cfg_disable CONFIG_SECURITY_DEFEX
          cfg_disable CONFIG_TIMA
          cfg_disable CONFIG_TIMA_LKMAUTH
          cfg_disable CONFIG_SEC_KAP
          cfg_disable CONFIG_INTEGRITY_SAMSUNG

          # ------------------------------------------------------
          # SELinux / Kprobes / Overlay
          # ------------------------------------------------------

          cfg_enable CONFIG_SECURITY_SELINUX_DEVELOP
          cfg_enable CONFIG_KPROBES
          cfg_enable CONFIG_KPROBE_EVENTS
          cfg_enable CONFIG_OVERLAY_FS

          # ------------------------------------------------------
          # SUSFS
          # ------------------------------------------------------

          if [ "${SUSFS_ENABLED:-false}" = "true" ]; then

            if grep -Rqs \
              -E \
              'config KSU_SUSFS' \
              "$KERNEL_DIR/KernelSU/kernel"
            then
              cfg_enable CONFIG_KSU_SUSFS
            fi

          fi

          echo
          echo "=================================================="
          echo "OLDDEFCONFIG"
          echo "=================================================="

          make \
            O="$OUT_DIR" \
            ARCH="$ARCH" \
            olddefconfig

          echo
          echo "=================================================="
          echo "FINAL CONFIG"
          echo "=================================================="

          grep -E \
            'CONFIG_(KSU|KSU_SUSFS|SEC_RESTRICT_FORK|SEC_RESTRICT_ROOTMOD|SECURITY_DEFEX|TIMA|TIMA_LKMAUTH|SEC_KAP|INTEGRITY_SAMSUNG|SECURITY_SELINUX_DEVELOP|KPROBES|KPROBE_EVENTS|OVERLAY_FS)=' \
            "$CONFIG" \
            || true

          echo
          echo "=================================================="
          echo "VERIFY CONFIG_KSU"
          echo "=================================================="

          grep -q '^CONFIG_KSU=y$' "$CONFIG"

          for symbol in \
            CONFIG_SEC_RESTRICT_FORK \
            CONFIG_SEC_RESTRICT_ROOTMOD \
            CONFIG_SECURITY_DEFEX \
            CONFIG_TIMA \
            CONFIG_TIMA_LKMAUTH \
            CONFIG_SEC_KAP \
            CONFIG_INTEGRITY_SAMSUNG
          do

            if grep -q "^${symbol}=y$" "$CONFIG"; then
              echo "ERROR: $symbol masih aktif."
              exit 1
            fi

          done

          cp \
            "$CONFIG" \
            "$GITHUB_WORKSPACE/output/gta9-final-config"

      # ==========================================================
      # 14. DTC HOST COMPATIBILITY FIX
      # ==========================================================
      - name: Fix and Test Host DTC
        shell: bash
        run: |
          set -euxo pipefail

          cd "$KERNEL_DIR"

          echo
          echo "=================================================="
          echo "HOST DTC COMPATIBILITY"
          echo "=================================================="

          echo "HOSTCC       : ${HOSTCC:-gcc}"
          echo "HOSTCFLAGS   : $HOSTCFLAGS"
          echo "HOSTCXXFLAGS : $HOSTCXXFLAGS"

          # Force rebuild of the embedded host DTC.
          rm -rf "$OUT_DIR/scripts/dtc"

          echo
          echo "=================================================="
          echo "BUILD scripts/dtc/dtc"
          echo "=================================================="

          make \
            V=1 \
            O="$OUT_DIR" \
            ARCH="$ARCH" \
            HOSTCFLAGS="$HOSTCFLAGS" \
            HOSTCXXFLAGS="$HOSTCXXFLAGS" \
            scripts/dtc/dtc

          test -x "$OUT_DIR/scripts/dtc/dtc"

          echo
          echo "=================================================="
          echo "DTC BUILD SUCCESS"
          echo "=================================================="

          "$OUT_DIR/scripts/dtc/dtc" --version || true

      # ==========================================================
      # 15. COMPILE KERNEL
      # ==========================================================
      - name: Compile Kernel
        shell: bash
        run: |
          set -euxo pipefail

          cd "$KERNEL_DIR"

          export PATH="$CLANG_PREBUILT_BIN:$PATH"

          export ARCH=arm64
          export SUBARCH=arm64

          export LLVM=1
          export LLVM_IAS=1

          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-

          export CC="ccache clang"
          export HOSTCC="gcc"
          export HOSTCXX="g++"

          echo
          echo "=================================================="
          echo "TOOLCHAIN"
          echo "=================================================="

          which clang
          which ld.lld
          which llvm-objcopy
          which gcc
          which aarch64-linux-gnu-gcc

          echo
          clang --version

          echo
          echo "HOSTCFLAGS=$HOSTCFLAGS"

          echo
          echo "=================================================="
          echo "BUILD KERNEL"
          echo "=================================================="

          make \
            V=1 \
            -Otarget \
            -j"$(nproc --all)" \
            O="$OUT_DIR" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            HOSTCFLAGS="$HOSTCFLAGS" \
            HOSTCXXFLAGS="$HOSTCXXFLAGS" \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi-

          echo
          echo "=================================================="
          echo "CCACHE"
          echo "=================================================="

          ccache --show-stats || true

      # ==========================================================
      # 16. ENSURE IMAGE + DTBS
      # ==========================================================
      - name: Build Image and DTBs
        shell: bash
        run: |
          set -euxo pipefail

          cd "$KERNEL_DIR"

          echo
          echo "=================================================="
          echo "BUILD IMAGE.GZ + DTBS"
          echo "=================================================="

          make \
            V=1 \
            -Otarget \
            -j"$(nproc --all)" \
            O="$OUT_DIR" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            HOSTCFLAGS="$HOSTCFLAGS" \
            HOSTCXXFLAGS="$HOSTCXXFLAGS" \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            Image.gz \
            dtbs

          echo
          echo "=================================================="
          echo "BOOT OUTPUT"
          echo "=================================================="

          find "$OUT_DIR/arch/arm64/boot" \
            -maxdepth 4 \
            -type f \
            -printf '%p\n' \
            | sort

      # ==========================================================
      # 17. VERIFY IMAGE
      # ==========================================================
      - name: Verify Kernel Image
        shell: bash
        run: |
          set -euxo pipefail

          BOOT_DIR="$OUT_DIR/arch/arm64/boot"

          test -d "$BOOT_DIR"

          IMAGE=""

          for candidate in \
            "$BOOT_DIR/Image.gz" \
            "$BOOT_DIR/Image" \
            "$BOOT_DIR/Image.lz4"
          do

            if [ -f "$candidate" ]; then
              IMAGE="$candidate"
              break
            fi

          done

          if [ -z "$IMAGE" ]; then
            echo "ERROR: Kernel Image tidak ditemukan."

            find "$BOOT_DIR" \
              -maxdepth 5 \
              -type f \
              -print \
              | sort

            exit 1
          fi

          echo
          echo "KERNEL IMAGE:"
          ls -lh "$IMAGE"

          case "$(basename "$IMAGE")" in

            Image.gz)
              cp \
                "$IMAGE" \
                "$GITHUB_WORKSPACE/output/Image.gz"
              ;;

            Image)
              cp \
                "$IMAGE" \
                "$GITHUB_WORKSPACE/output/Image"
              ;;

            Image.lz4)
              cp \
                "$IMAGE" \
                "$GITHUB_WORKSPACE/output/Image.lz4"
              ;;

          esac

      # ==========================================================
      # 18. COLLECT DTB / DTBO
      # ==========================================================
      - name: Collect DTB and DTBO
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "$GITHUB_WORKSPACE/output/dtb"
          mkdir -p "$GITHUB_WORKSPACE/output/dtbo"

          echo
          echo "=================================================="
          echo "DTB / DTBO"
          echo "=================================================="

          find "$OUT_DIR" \
            -type f \
            \( \
              -name '*.dtb' \
              -o -name 'dtb.img' \
              -o -name '*.dtbo' \
              -o -name 'dtbo.img' \
            \) \
            -print \
            | sort \
            | tee "$GITHUB_WORKSPACE/output/dtb-list.txt"

          DTB_COUNT=0
          DTBO_COUNT=0

          while IFS= read -r file
          do

            case "$file" in

              *.dtbo|*/dtbo.img)

                DTBO_COUNT=$((DTBO_COUNT + 1))

                cp -vf \
                  "$file" \
                  "$GITHUB_WORKSPACE/output/dtbo/$(basename "$file")"

                ;;

              *)

                DTB_COUNT=$((DTB_COUNT + 1))

                cp -vf \
                  "$file" \
                  "$GITHUB_WORKSPACE/output/dtb/$(basename "$file")"

                ;;

            esac

          done < <(
            find "$OUT_DIR" \
              -type f \
              \( \
                -name '*.dtb' \
                -o -name 'dtb.img' \
                -o -name '*.dtbo' \
                -o -name 'dtbo.img' \
              \) \
              -print \
              | sort
          )

          echo
          echo "DTB_COUNT=$DTB_COUNT"
          echo "DTBO_COUNT=$DTBO_COUNT"

          echo "DTB_COUNT=$DTB_COUNT" >> "$GITHUB_ENV"
          echo "DTBO_COUNT=$DTBO_COUNT" >> "$GITHUB_ENV"

          if [ "$DTB_COUNT" -eq 0 ]; then
            echo
            echo "ERROR: DTB tidak ditemukan."
            exit 1
          fi

      # ==========================================================
      # 19. BUILD INFO
      # ==========================================================
      - name: Generate Build Information
        shell: bash
        run: |
          set -euxo pipefail

          cd "$KERNEL_DIR"

          {
            echo "BuiKern S9Ta9"
            echo
            echo "BUILD_TIME=$BUILD_TIME"
            echo "KERNEL_REPO=$KERNEL_REPO"
            echo "KERNEL_BRANCH=$KERNEL_BRANCH"
            echo "KERNEL_COMMIT=$(git rev-parse HEAD)"
            echo "KERNEL_VERSION=$(make kernelversion)"
            echo "DEFCONFIG=$DEFCONFIG"
            echo "CLANG_VERSION=$CLANG_VERSION"
            echo "HOSTCFLAGS=$HOSTCFLAGS"
            echo "SUSFS_BRANCH=$SUSFS_BRANCH"
            echo "SUSFS_ENABLED=${SUSFS_ENABLED:-false}"
            echo "DTB_COUNT=${DTB_COUNT:-0}"
            echo "DTBO_COUNT=${DTBO_COUNT:-0}"
          } | tee "$GITHUB_WORKSPACE/output/build-info.txt"

      # ==========================================================
      # 20. RAW PACKAGE
      # ==========================================================
      - name: Package Raw Kernel
        shell: bash
        run: |
          set -euxo pipefail

          cd "$GITHUB_WORKSPACE/output"

          rm -f BuiKern-S9Ta9-Raw.zip

          zip -r9 \
            BuiKern-S9Ta9-Raw.zip \
            Image* \
            gta9-final-config \
            build-info.txt \
            dtb-list.txt \
            dtb \
            dtbo

          ls -lh BuiKern-S9Ta9-Raw.zip

      # ==========================================================
      # 21. ANYKERNEL3
      # ==========================================================
      - name: Prepare AnyKernel3
        shell: bash
        run: |
          set -euxo pipefail

          cd "$GITHUB_WORKSPACE"

          rm -rf AnyKernel3

          git clone \
            --depth=1 \
            https://github.com/osm0sis/AnyKernel3.git \
            AnyKernel3

          test -f AnyKernel3/anykernel.sh

          if [ -f "$GITHUB_WORKSPACE/output/Image.gz" ]; then

            cp \
              "$GITHUB_WORKSPACE/output/Image.gz" \
              AnyKernel3/Image.gz

          elif [ -f "$GITHUB_WORKSPACE/output/Image" ]; then

            cp \
              "$GITHUB_WORKSPACE/output/Image" \
              AnyKernel3/Image

          elif [ -f "$GITHUB_WORKSPACE/output/Image.lz4" ]; then

            cp \
              "$GITHUB_WORKSPACE/output/Image.lz4" \
              AnyKernel3/Image.lz4

          else

            echo "ERROR: Image tidak ditemukan."
            exit 1

          fi

          mkdir -p AnyKernel3/dtb

          if [ -d "$GITHUB_WORKSPACE/output/dtb" ]; then

            cp -av \
              "$GITHUB_WORKSPACE/output/dtb/." \
              AnyKernel3/dtb/

          fi

          if grep -q 'do.devicecheck=' AnyKernel3/anykernel.sh; then

            sed -i \
              's/^do.devicecheck=.*/do.devicecheck=0/' \
              AnyKernel3/anykernel.sh

          fi

      # ==========================================================
      # 22. PACKAGE ANYKERNEL3
      # ==========================================================
      - name: Package Flashable Kernel
        shell: bash
        run: |
          set -euxo pipefail

          cd "$GITHUB_WORKSPACE/AnyKernel3"

          rm -f \
            "$GITHUB_WORKSPACE/output/BuiKern-S9Ta9-Kernel.zip"

          zip -r9 \
            "$GITHUB_WORKSPACE/output/BuiKern-S9Ta9-Kernel.zip" \
            . \
            -x '.git/*' \
            -x '.github/*'

          ls -lh \
            "$GITHUB_WORKSPACE/output/BuiKern-S9Ta9-Kernel.zip"

      # ==========================================================
      # 23. SHA256
      # ==========================================================
      - name: Generate SHA256
        shell: bash
        run: |
          set -euxo pipefail

          cd "$GITHUB_WORKSPACE/output"

          sha256sum \
            Image* \
            BuiKern-S9Ta9-Raw.zip \
            BuiKern-S9Ta9-Kernel.zip \
            > SHA256SUMS.txt

          cat SHA256SUMS.txt

      # ==========================================================
      # 24. FINAL SUMMARY
      # ==========================================================
      - name: Final Build Summary
        shell: bash
        run: |
          set -e

          echo
          echo "=================================================="
          echo "             BuiKern S9Ta9"
          echo "=================================================="

          echo "Kernel branch : $KERNEL_BRANCH"
          echo "Kernel commit : $(cd "$KERNEL_DIR" && git rev-parse HEAD)"
          echo "Kernel config : $DEFCONFIG"
          echo "Clang         : $CLANG_VERSION"
          echo "HOSTCFLAGS    : $HOSTCFLAGS"
          echo "SUSFS         : ${SUSFS_ENABLED:-false}"
          echo "DTB count     : ${DTB_COUNT:-0}"
          echo "DTBO count    : ${DTBO_COUNT:-0}"

          echo
          echo "=================================================="
          echo "ARTIFACTS"
          echo "=================================================="

          find "$GITHUB_WORKSPACE/output" \
            -maxdepth 2 \
            -type f \
            -printf '%p\n' \
            | sort

          echo
          echo "=================================================="
          echo "BUILD SUCCESS"
          echo "=================================================="

      # ==========================================================
      # 25. UPLOAD
      # ==========================================================
      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BuiKern-S9Ta9
          path: |
            ${{ github.workspace }}/output/**
          if-no-files-found: error
          retention-days: 14
